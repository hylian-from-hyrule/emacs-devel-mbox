name: Update emacs-devel mbox

on:
  workflow_dispatch:
  schedule:
    - cron: "0 16,17 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check Madrid time
        id: madrid
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          HOUR=$(TZ=Europe/Madrid date +%H)

          if [ "$HOUR" = "18" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.madrid.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Compute current month
        if: steps.madrid.outputs.run == 'true'
        id: month
        run: echo "value=$(TZ=Europe/Madrid date +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Download emacs-devel mbox
        if: steps.madrid.outputs.run == 'true'
        run: |
          mkdir -p mbox

          curl -fL \
            "https://lists.gnu.org/archive/mbox/emacs-devel/${{ steps.month.outputs.value }}" \
            -o "mbox/${{ steps.month.outputs.value }}"

      - name: Commit changes
        if: steps.madrid.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add mbox/

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Update emacs-devel mbox ${{ steps.month.outputs.value }}"
          git push